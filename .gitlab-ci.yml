image: ruby:3.1

pages:
  stage: deploy

  before_script:
    - gem install bundler -v 2.6.6
    - cd docs
    - bundle _2.6.6_ install

  script:
    - bundle _2.6.6_ exec jekyll build -d ../public

  artifacts:
    paths:
      - public

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH